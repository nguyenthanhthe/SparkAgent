name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt coverage
      - name: Byte-compile everything
        run: python -m compileall kernel openshell brain tools interface swarm security memory_search ops benchmarks tests main.py
      - name: Self-check
        run: python main.py --check
      - name: Unit tests under coverage
        run: coverage run -m unittest discover -s tests -t .
      - name: Coverage summary
        run: coverage report --sort=cover
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .coverage
          retention-days: 14
