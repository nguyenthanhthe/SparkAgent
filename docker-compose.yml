# SparkAgent compose: dashboard on http://127.0.0.1:8788
# GLM_API_KEY comes from the environment or .env — never committed.
services:
  sparkagent:
    build: .
    image: sparkagent:latest
    container_name: sparkagent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    env_file:
      - path: .env
        required: false
    environment:
      SPARKAGENT_BRAIN__LOCAL__BASE_URL: http://host.docker.internal:11434
    volumes:
      - sparkagent-data:/app/data
      - sparkagent-skills:/app/skills
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  sparkagent-data:
  sparkagent-skills:
